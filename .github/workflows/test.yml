name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        accel: ["require"]
        include:
          # Exercise the pure-Python fallbacks the accelerators replace.
          - python-version: "3.14"
            accel: "none"
    name: test (${{ matrix.python-version }}, accel=${{ matrix.accel }})
    env:
      TAMAGO_REQUIRE_ACCEL: ${{ matrix.accel == 'require' && '1' || '' }}
      TAMAGO_NO_ACCEL: ${{ matrix.accel == 'none' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hatch
        run: pip install hatch
      - name: Run tests
        run: hatch run test
      - name: Check style
        run: hatch run lint:style
