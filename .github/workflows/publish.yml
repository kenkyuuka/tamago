name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      TAMAGO_REQUIRE_ACCEL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hatch
        run: pip install hatch
      - name: Run tests
        run: hatch run test
      - name: Check style
        run: hatch run lint:style

  # Platform wheels with the C accelerators (configured under
  # [tool.cibuildwheel] in pyproject.toml).
  wheels:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/

  # The sdist, plus a pure-Python wheel for platforms without a built one.
  sdist:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAMAGO_NO_ACCEL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Hatch
        run: pip install hatch
      - name: Build
        run: hatch build
      - uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: dist/

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
